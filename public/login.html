<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Department of Civic Services</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/">
        <strong>Department of Civic Services</strong>
        <span>Infrastructure Service Requests</span>
      </a>
    </div>
  </header>

  <main class="wrap auth">
    <h1>Sign in</h1>
    <p>Sign in to report a problem and track your requests.</p>

    <form class="auth-card" id="auth-form" data-mode="login" novalidate>
      <p class="form-error" id="form-error" role="alert" tabindex="-1"></p>
      <div class="field">
        <label class="lbl" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="ts-slot" id="turnstile-widget"></div>
      <button class="btn" type="submit">Sign in</button>
      <p class="alt">New here? <a href="/signup">Create an account</a></p>
    </form>
  </main>

  <footer>
    <div class="wrap">
      <p>Department of Civic Services &middot; 400 Civic Plaza</p>
      <p>Demo site: this agency is fictional.</p>
    </div>
  </footer>
  <script src="/auth.js" defer></script>
</body>
</html>
